name: Publish GFS wind

on:
  schedule:
    # Four GFS cycles daily; offset from the hour to reduce scheduler contention.
    - cron: '17 4,10,16,22 * * *'
    # Reuse this established schedule for hourly regional publication as well.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kilat-wind-publication
  cancel-in-progress: false

jobs:
  regional:
    uses: ./.github/workflows/regional.yml
    secrets: inherit

  publish:
    if: vars.WIND_PUBLISH_ENABLED == '1' && (github.event_name != 'schedule' || github.event.schedule == '17 4,10,16,22 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check wind source and time invariants
        run: python -m unittest discover -s backend/test -p 'test_wind_contract.py'
      - name: Install GRIB decoder
        run: python -m pip install -r backend/scripts/wind-requirements.txt
      - name: Build complete, unexpired wind document
        run: python backend/scripts/build-wind.py --output wind-public/latest.json
      - name: Verify consumer contract before publication
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          import sys
          sys.path.insert(0, 'backend/scripts')
          from wind_contract import parse_model
          for name in ('latest.json', 'latest-v2.json'):
              result = parse_model(Path('wind-public', name).read_bytes())
              if result.status != 'available':
                  raise SystemExit(result.reason)
              if dt.datetime.now(dt.timezone.utc) >= result.data.expires_at:
                  raise SystemExit(f'{name}: wind publication expired before deployment')
          print('Both consumer contracts verified; dated wind documents ready')
          PY
      - name: Publish static document
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 pages deploy wind-public --project-name kilat-wind --branch main
      - name: Verify hosted publication
        run: |
          for name in latest.json latest-v2.json; do
          matched=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$RUNNER_TEMP/wind-hosted.json" \
              "https://kilat-wind.pages.dev/${name}?publication=${GITHUB_RUN_ID}-${attempt}" \
              && cmp --silent "wind-public/${name}" "$RUNNER_TEMP/wind-hosted.json"; then
              echo "Hosted ${name} matches the validated document"
              matched=1
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          if [ "$matched" -ne 1 ]; then
            echo "Hosted ${name} did not match after bounded propagation checks" >&2
            exit 1
          fi
          done
