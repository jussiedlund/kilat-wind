name: Collect fire hotspot counts

on:
  schedule:
    # Repeat through the day so a dropped schedule is recovered by the next run.
    - cron: '43 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kilat-hotspots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count complete days from the FIRMS 7-day file
        run: |
          python backend/scripts/firms_recent.py > "$RUNNER_TEMP/hotspots.sql"
          cat "$RUNNER_TEMP/hotspots.sql"
          rows=$(grep -c '^REPLACE INTO hotspot_recent' "$RUNNER_TEMP/hotspots.sql" || true)
          if [ "$rows" -lt 3 ]; then echo "Only $rows complete days in the FIRMS file; not writing" >&2; exit 1; fi
          cat backend/scripts/publish-hotspot-counts.sql >> "$RUNNER_TEMP/hotspots.sql"
      - name: Write counts to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 execute sg-map-lens-data --remote --file "$RUNNER_TEMP/hotspots.sql"
      - name: Verify newest stored day
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.145.0 d1 execute sg-map-lens-data --remote --json \
            --command "SELECT MAX(date) AS newest FROM hotspot_recent" > "$RUNNER_TEMP/newest.json"
          newest=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))[0]['results'][0]['newest'])" "$RUNNER_TEMP/newest.json")
          yesterday=$(date -u -d 'yesterday' +%F)
          echo "Newest stored day: $newest (expected $yesterday)"
          if [[ "$newest" < "$yesterday" ]]; then echo "Stored counts are behind" >&2; exit 1; fi
