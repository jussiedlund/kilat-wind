name: Publish regional hotspots and haze

on:
  schedule:
    # Hourly retries leave room for delayed/dropped GitHub schedules before the app's 4h freshness limit.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kilat-regional-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check publication invariants
        run: node --experimental-strip-types --test backend/test/regional-collector.test.mjs backend/test/hotspot-publication.test.mjs
      - name: Fetch and validate official regional layers
        run: node --experimental-strip-types backend/scripts/build-regional.mjs --output "$RUNNER_TEMP/regional.sql"
      - name: Publish capture and history atomically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 d1 execute sg-map-lens-data --remote --file "$RUNNER_TEMP/regional.sql" --yes
      - name: Verify served freshness and geometry
        run: |
          node --input-type=module - <<'JS'
          const response = await fetch('https://sg-map-lens-data.sgenv.workers.dev/v1/regional?publication=' + process.env.GITHUB_RUN_ID);
          if (!response.ok) throw new Error(`Regional API ${response.status}`);
          const data = await response.json();
          const age = Date.now() - Date.parse(data.fetchedAt);
          if (!Number.isFinite(age) || age < -60_000 || age > 30 * 60_000) throw new Error('Regional publication is not fresh');
          if (!Array.isArray(data.hotspots?.points) || !Array.isArray(data.haze?.polygons)) throw new Error('Regional payload missing geometry');
          console.log(`Verified ${data.hotspots.points.length} hotspots, ${data.haze.polygons.length} haze polygons; fetched ${data.fetchedAt}`);
          JS
